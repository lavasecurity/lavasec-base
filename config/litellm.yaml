# Gateway catalog TEMPLATE. 30-gateway.sh renders this at install time:
# each "requires <KEY>" section is included only when that key is set
# non-empty in /etc/lavasec/lavasec.env — so every box's live catalog
# contains exactly its keyed providers, and keyless models never appear
# in anyone's picker.
#
# Policy (owner calls, 2026-07-29):
#   - Keyed NATIVE providers get a wildcard here: ANY provider slug routes
#     through, even one nobody has listed yet.
#   - The LISTING comes from 30-gateway.sh syncing each provider's own
#     /models endpoint into generated entries (litellm's bundled price DB
#     lags badly — OpenCode Zen listed 1 of 60 models, kimi-k3 not at all).
#     Add a provider to PROVIDER_CATALOGS there, not by hand here.
# Keys come from /etc/lavasec/lavasec.env — never inline.
model_list:
  # >>> requires DEEPSEEK_API_KEY
  - model_name: "deepseek/*"
    litellm_params:
      model: "deepseek/*"
      api_key: os.environ/DEEPSEEK_API_KEY
  # <<< requires DEEPSEEK_API_KEY
  # >>> requires OPENROUTER_API_KEY
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY
  # <<< requires OPENROUTER_API_KEY
  # >>> requires ANTHROPIC_API_KEY
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY
  # <<< requires ANTHROPIC_API_KEY
  # >>> requires OPENAI_API_KEY
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY
  # <<< requires OPENAI_API_KEY
  # neuralwatt, opencode (Zen) and ollama are custom OpenAI-compatible
  # endpoints — their entries are generated by the catalog sync, so no
  # wildcard here (a wildcard would mislist the generic openai catalog).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  # Langfuse tracing — instrument ONCE here and every client (pi, opencode,
  # the web UIs, anything added later) is traced, because they all reach
  # providers through this gateway. Activates only when the keys exist in
  # /etc/lavasec/lavasec.env; costs/latency/tokens per model included.
  # LANGFUSE_ENABLED is computed by 30-gateway.sh (all three LANGFUSE_*
  # vars present) — one condition drives both this block and the SDK
  # install, so they can never disagree
  # >>> requires LANGFUSE_ENABLED
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Tag every trace with the model_name the CALLER asked for.
  #
  # Langfuse's "model" field is the dispatch string, not the alias: litellm's
  # reconstruct_model_name() prefers metadata["deployment"], which router.py
  # sets to litellm_params.model. For a custom OpenAI-compatible provider that
  # is "openai/<id>", so a Neuralwatt call is filed under "openai/glm-5.2" --
  # the protocol adapter, not the vendor. Harmless while no real OPENAI_API_KEY
  # exists, but native openai routes would then share that namespace and
  # per-vendor spend could no longer be separated.
  #
  # metadata["model_group"] holds the public name ("neuralwatt/glm-5.2"), and
  # the langfuse handler turns any metadata key listed here into a filterable
  # "key:value" tag. The model field itself cannot be changed without patching
  # litellm.
  #
  # Agent trace tags: the dispatch script (agent-dispatch.sh) sets these as env
  # vars, and opencode passes them as metadata in gateway requests.
  #   agent=<name>       — which agent made the call
  #   flow=B|C           — drain or digest
  #   module=<name>      — which module's LLM call (01-collect, 03-red-team, …)
  #
  # These are all LOW-CARDINALITY, which is what a tag is for: a handful of
  # stable values you filter by.
  #
  # Grouping the calls of ONE run is deliberately NOT a tag. A unique-per-run
  # tag makes the tag filter grow without bound; Langfuse has a purpose-built
  # concept instead. litellm pops metadata.session_id (langfuse.py:553) into
  # trace_params (:614), so the run lands in the native Sessions view. Do NOT
  # add session_id to this list — the tag loop (:530) runs BEFORE that pop, so
  # listing it would make it a tag too and reintroduce the problem.
  #
  # HOW the agent dimensions actually arrive: not as request-body metadata.
  # litellm's proxy honours these REQUEST HEADERS (litellm_pre_call_utils.py):
  #   x-litellm-session-id  :1167 area, explicit high-priority session grouping
  #   x-litellm-tags        :1168  comma-separated, becomes trace tags directly
  #   x-litellm-trace-id           pin a trace id
  # A generic `^x-.+-session-id$` pattern is honoured too (:43), which is how
  # e.g. x-claude-code-session-id works. Session-id values must match
  # ^[a-zA-Z0-9_-]{8,}$ (:47) — under 8 chars is silently rejected.
  #
  # Because x-litellm-tags sets tags directly, the agent/flow/module entries
  # below are only needed if a caller sends those as metadata KEYS. They are
  # harmless when absent (a key not in metadata simply produces no tag).
  langfuse_default_tags: ["model_group", "agent", "flow", "module"]
  # <<< requires LANGFUSE_ENABLED
  # Optional local sink, off unless GENERIC_LOGGER_ENDPOINT is set. Posts a
  # StandardLoggingPayload per call to that URL — see scripts/35-eval-receiver.sh
  # for a loopback receiver, or point it at anything that accepts JSON.
  #
  # `callbacks`, NOT success_callback: the proxy REBUILDS litellm.success_callback
  # when it sees that key (proxy_server.py ~4578), so a second block emitting it
  # would fight the langfuse one above. `callbacks` registers additively through
  # initialize_callbacks_on_proxy, so the two are independent.
  #
  # Ordered after the langfuse block deliberately, since the reset above happens
  # when success_callback is processed.
  #
  # generic_api RAISES if GENERIC_LOGGER_ENDPOINT is unset. Gating the block on
  # that same key is what makes that impossible rather than merely documented.
  # >>> requires GENERIC_LOGGER_ENDPOINT
  callbacks: ["generic_api"]
  # <<< requires GENERIC_LOGGER_ENDPOINT
