# Gateway catalog. Policy (owner call, 2026-07-29):
#   - KEYED native providers get a wildcard: dynamic listing from litellm's
#     model DB, and ANY provider slug routes through even if unlisted.
#   - Explicit entries where litellm's DB is blind: custom OpenAI-compatible
#     endpoints (a wildcard there would mislist the generic openai catalog)
#     and brand-new models the DB hasn't picked up (metadata via model_info).
#   - Providers WITHOUT keys get no routes at all — keyless models don't
#     belong in anyone's picker.
# Keys come from /etc/lavasec/lavasec.env — never inline. Adding a model on
# a custom endpoint = one entry + re-run scripts/30-gateway.sh.
# model_info costs are USD per TOKEN (not per MTok).
model_list:
  - model_name: "deepseek/*"
    litellm_params:
      model: "deepseek/*"
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY
  # in litellm's DB not yet — explicit entry carries metadata (OpenRouter
  # published pricing); remove once the DB catches up
  - model_name: "openrouter/moonshotai/kimi-k3"
    litellm_params:
      model: "openrouter/moonshotai/kimi-k3"
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003
      max_input_tokens: 1048576
      max_output_tokens: 32768
  - model_name: "neuralwatt/qwen3.6-35b"
    litellm_params:
      model: "openai/qwen3.6-35b"
      api_base: "https://api.neuralwatt.com/v1"
      api_key: os.environ/NEURALWATT_API_KEY
    model_info:
      mode: chat
      max_input_tokens: 131072
      max_output_tokens: 32768
  - model_name: "neuralwatt/kimi-k2.6"
    litellm_params:
      model: "openai/kimi-k2.6"
      api_base: "https://api.neuralwatt.com/v1"
      api_key: os.environ/NEURALWATT_API_KEY
    model_info:
      mode: chat
      max_input_tokens: 131072
      max_output_tokens: 32768
  - model_name: "neuralwatt/glm-5.2"
    litellm_params:
      model: "openai/glm-5.2"
      api_base: "https://api.neuralwatt.com/v1"
      api_key: os.environ/NEURALWATT_API_KEY
    model_info:
      mode: chat
      max_input_tokens: 131072
      max_output_tokens: 32768
  - model_name: "opencode/gpt-5.5"
    litellm_params:
      model: "openai/gpt-5.5"
      api_base: "https://opencode.ai/zen/v1"
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
      cache_read_input_token_cost: 0.0000005
      max_input_tokens: 272000
      max_output_tokens: 32768

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
