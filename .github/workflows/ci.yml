name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax + shellcheck
        run: |
          bash -n bootstrap.sh scripts/*.sh
          shellcheck bootstrap.sh scripts/*.sh

      - name: config sanity
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import yaml
          cfg = yaml.safe_load(open("config/litellm.yaml"))
          mk = cfg.get("general_settings", {}).get("master_key")
          assert mk == "os.environ/LITELLM_MASTER_KEY", f"master_key misconfigured: {mk!r}"
          EOF
          grep -qE "^lavasecurity/lavasec-base$" config/repos.txt

      - name: no credential-bearing curl options
        run: |
          # Structural rule, not shape-matching: this repo passes NO curl
          # headers or credentials on the command line — every request writes
          # a 0600 config file and uses `curl -K`. Matching the *value* is
          # unwinnable (variables, attached args, bundled flags), so the
          # OPTION is banned. Continuations are joined first: an option can
          # sit on a later physical line than its `curl`.
          hits=""
          for f in scripts/*.sh setup.sh bootstrap.sh; do
            found="$(sed -e ':a' -e '/\\$/{N;s/\\\n//;ba' -e '}' "$f" \
              | grep -v '^[[:space:]]*#' \
              | grep -n 'curl' \
              | grep -E -- '(^|[^-A-Za-z])-[A-Za-z]*[Hu]|--(header|user)([^-A-Za-z]|=|$)' || true)"
            if [ -n "$found" ]; then
              hits="${hits}$(printf '%s\n' "$found" | sed "s|^|$f:|")\n"
            fi
          done
          if [ -n "$hits" ]; then
            printf '%b' "$hits" >&2
            echo "^^ curl must not take -H/--header/-u/--user: write a 0600 config file and use -K" >&2
            exit 1
          fi
          echo "OK: no credential-bearing curl options"

      - name: no secret-shaped strings committed
        run: |
          if grep -rInE "sk-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{24,}|ghp_[A-Za-z0-9]{24,}" --exclude-dir=.git .; then
            echo "possible committed secret (see matches above)" >&2
            exit 1
          fi
